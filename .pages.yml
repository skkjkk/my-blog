# Pages CMS 配置：定义"后台"里能看到、能改什么
# 文档：https://pagescms.org/docs/configuration/

# 上传的图片存到 public/images/，frontmatter 里写 /images/xxx.jpg 就能引用
media:
  input: public/images
  output: /images

content:
  # ---------- 文章 ----------
  - name: posts
    label: 文章
    type: collection
    path: src/content/posts
    filename:
      template: "{year}-{month}-{day}-{fields.slug}.md"
      field: create
    view:
      primary: title
      sort: published
      order: desc
      fields: [title, published, draft]
    fields:
      - name: title
        label: 标题
        type: string
        required: true

      - name: slug
        label: 网址短名（只能用英文/数字/连字符）
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: 会变成文章链接的一部分，例如 hello-world 会得到 /posts/2026-10-30-hello-world/。发布后不要再改。

      - name: published
        label: 发布日期
        type: date
        required: true
        options:
          time: false

      - name: description
        label: 摘要（显示在列表中，也用于 SEO）
        type: text

      - name: image
        label: 封面图（可留空）
        type: image

      - name: tags
        label: 标签
        type: string
        list: true

      - name: category
        label: 分类
        type: string

      - name: draft
        label: 草稿（勾上就不会发布）
        type: boolean

      - name: body
        label: 正文
        type: rich-text

  # ---------- 关于页 ----------
  - name: about
    label: 关于页
    type: file
    path: src/content/spec/about.md
    fields:
      - name: body
        label: 内容
        type: rich-text

# 提交信息统一格式，方便以后回滚
settings:
  commit:
    identity: user
